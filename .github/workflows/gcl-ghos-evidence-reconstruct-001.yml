name: GCL-GHOS evidence reconstruct 001
# Checkout is pinned to the PR head branch so staged parts cannot race the synthetic merge ref.

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/gcl-ghos-evidence-reconstruct-001.yml"

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false
      - name: Verify, extract, publish, and clean temporary bundle
        env:
          REPO_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import json
          import os
          import tarfile
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          API = "https://api.github.com"
          TOKEN = os.environ["REPO_TOKEN"]
          BRANCH = os.environ["HEAD_BRANCH"]
          PREFIX = Path(".ingest/GCL-GHOS-SETTINGS-READBACK-001.tgz.b64")
          PARTS = [Path(f"{PREFIX}.part{index:02d}") for index in range(4)]
          WORKFLOW = ".github/workflows/gcl-ghos-evidence-reconstruct-001.yml"
          EXPECTED_TAR_SHA256 = "073310d8874a98798ae499da6e1dda0d4802aa19fbdcc79ede020e6097a26dd2"

          TARGETS = {
              "GCL-GHOS-SETTINGS-READBACK-001.raw.json": "evidence/settings-readback/GCL-GHOS-SETTINGS-READBACK-001.raw.json",
              "GCL-GHOS-RULESET-DETAILS-001.raw.json": "evidence/settings-readback/GCL-GHOS-RULESET-DETAILS-001.raw.json",
              "GCL-GHOS-REPOSITORY-SURFACES-001.raw.json": "evidence/settings-readback/GCL-GHOS-REPOSITORY-SURFACES-001.raw.json",
              "GCL-GHOS-SETTINGS-READBACK-001.normalized.json": "evidence/settings-readback/GCL-GHOS-SETTINGS-READBACK-001.normalized.json",
              "GCL-GHOS-SETTINGS-READBACK-001.ledger.json": "deviations/GCL-GHOS-SETTINGS-READBACK-001.json",
              "settings_readback.schema.json": "schemas/settings_readback.schema.json",
              "settings_readback.py": "ci/settings_readback.py",
              "test_settings_readback.py": "tests/test_settings_readback.py",
          }

          def api(method: str, path: str, body: object | None = None):
              data = None if body is None else json.dumps(body).encode("utf-8")
              req = urllib.request.Request(
                  API + path,
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {TOKEN}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "gcl-ghos-evidence-reconstruct-001",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      payload = response.read()
                      return response.status, json.loads(payload) if payload else None
              except urllib.error.HTTPError as exc:
                  payload = exc.read()
                  try:
                      parsed = json.loads(payload) if payload else None
                  except json.JSONDecodeError:
                      parsed = payload.decode("utf-8", errors="replace")
                  return exc.code, parsed

          encoded = "".join(part.read_text(encoding="utf-8") for part in PARTS)
          archive = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(archive).hexdigest()
          if digest != EXPECTED_TAR_SHA256:
              raise SystemExit(f"bundle digest mismatch: {digest}")

          staging = Path("/tmp/gcl-settings-package")
          staging.mkdir(parents=True, exist_ok=True)
          archive_path = staging / "package.tgz"
          archive_path.write_bytes(archive)
          with tarfile.open(archive_path, "r:gz") as bundle:
              members = bundle.getmembers()
              if {member.name for member in members} != set(TARGETS):
                  raise SystemExit("bundle member inventory mismatch")
              bundle.extractall(staging, filter="data")

          published = []
          for source, target in TARGETS.items():
              content = (staging / source).read_text(encoding="utf-8")
              status, payload = api(
                  "PUT",
                  f"/repos/grandchallenge/gcl-standards/contents/{urllib.parse.quote(target, safe='/')}",
                  {
                      "message": f"Admit GCL-GHOS settings evidence {target.rsplit('/', 1)[-1]}",
                      "content": base64.b64encode(content.encode("utf-8")).decode("ascii"),
                      "branch": BRANCH,
                  },
              )
              if status != 201:
                  raise SystemExit(f"publish failed for {target}: {status} {payload}")
              published.append(target)

          for path in [str(part) for part in PARTS] + [WORKFLOW]:
              quoted = urllib.parse.quote(path, safe="/")
              status, payload = api(
                  "GET",
                  f"/repos/grandchallenge/gcl-standards/contents/{quoted}?ref={urllib.parse.quote(BRANCH, safe='')}",
              )
              if status != 200 or not isinstance(payload, dict):
                  raise SystemExit(f"cleanup lookup failed for {path}: {status} {payload}")
              status, deleted = api(
                  "DELETE",
                  f"/repos/grandchallenge/gcl-standards/contents/{quoted}",
                  {
                      "message": f"Remove temporary evidence bundle input {path.rsplit('/', 1)[-1]}",
                      "sha": payload["sha"],
                      "branch": BRANCH,
                  },
              )
              if status != 200:
                  raise SystemExit(f"cleanup failed for {path}: {status} {deleted}")

          print(json.dumps({"bundle_sha256": digest, "published": published, "temporary_files_removed": 5}, indent=2))
          PY
