name: Patch MODULUS profile inventory

on:
  pull_request:
    branches: [main]
    paths:
      - "fixtures/repository_profiles/MODULUS.json"
      - ".github/workflows/patch-modulus-profile-inventory.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
      - name: Register MODULUS profile and self-remove
        shell: python
        run: |
          from pathlib import Path
          path = Path("ci/validate.py")
          text = path.read_text(encoding="utf-8")
          needle = '    "MATH-PROGRAMME.json",\n'
          replacement = needle + '    "MODULUS.json",\n'
          if '    "MODULUS.json",\n' not in text:
              if needle not in text:
                  raise SystemExit("profile inventory anchor missing")
              path.write_text(text.replace(needle, replacement, 1), encoding="utf-8")
          Path(".github/workflows/patch-modulus-profile-inventory.yml").unlink()
      - name: Commit final branch state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/validate.py .github/workflows/patch-modulus-profile-inventory.yml
          git commit -m "Register MODULUS profile in exact inventory"
          git push
