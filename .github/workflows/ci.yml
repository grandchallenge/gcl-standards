name: Standards policy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standards-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  standards-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Admission validation resolves canonical blobs at historical commits.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12.13"
          cache: pip
      - name: Install pinned policy dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Validate standards
        run: python ci/validate.py
      - name: Run adversarial tests
        run: python -m unittest discover -s tests -p "test_*.py"
