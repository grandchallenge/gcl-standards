name: GCL-GHOS evidence ingest 001

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/gcl-ghos-evidence-ingest-001.yml"

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Mint cross-repository artifact token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ secrets.GCL_COUNCIL_CLERK_APP_ID }}
          private-key: ${{ secrets.GCL_COUNCIL_CLERK_PRIVATE_KEY }}
          owner: grandchallenge
      - name: Ingest immutable readback artifacts into evidence branch
        env:
          CLERK_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          import io
          import json
          import os
          import urllib.error
          import urllib.request
          import zipfile

          API = "https://api.github.com"
          CLERK_TOKEN = os.environ["CLERK_TOKEN"]
          REPO_TOKEN = os.environ["REPO_TOKEN"]
          BRANCH = os.environ["HEAD_BRANCH"]

          ARTIFACTS = {
              8853796911: (
                  "GCL-GHOS-SETTINGS-READBACK-001.json",
                  "evidence/settings-readback/GCL-GHOS-SETTINGS-READBACK-001.raw.json",
              ),
              8853844174: (
                  "GCL-GHOS-RULESET-DETAILS-001.json",
                  "evidence/settings-readback/GCL-GHOS-RULESET-DETAILS-001.raw.json",
              ),
              8853960698: (
                  "GCL-GHOS-REPOSITORY-SURFACES-001.json",
                  "evidence/settings-readback/GCL-GHOS-REPOSITORY-SURFACES-001.raw.json",
              ),
          }

          def request(method: str, url: str, token: str, body: object | None = None):
              data = None if body is None else json.dumps(body).encode("utf-8")
              req = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "gcl-ghos-evidence-ingest-001",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      return response.status, response.read()
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read()

          committed = []
          for artifact_id, (member, target) in ARTIFACTS.items():
              status, archive = request(
                  "GET",
                  f"{API}/repos/grandchallenge/.github/actions/artifacts/{artifact_id}/zip",
                  CLERK_TOKEN,
              )
              if status != 200:
                  raise SystemExit(f"artifact {artifact_id} download failed: {status} {archive[:500]!r}")
              with zipfile.ZipFile(io.BytesIO(archive)) as bundle:
                  content = bundle.read(member).decode("utf-8")
              status, payload = request(
                  "PUT",
                  f"{API}/repos/grandchallenge/gcl-standards/contents/{target}",
                  REPO_TOKEN,
                  {
                      "message": f"Admit raw settings evidence artifact {artifact_id}",
                      "content": base64.b64encode(content.encode("utf-8")).decode("ascii"),
                      "branch": BRANCH,
                  },
              )
              if status != 201:
                  raise SystemExit(f"evidence write failed for {target}: {status} {payload[:1000]!r}")
              committed.append({"artifact_id": artifact_id, "target": target})

          print(json.dumps({"branch": BRANCH, "committed": committed}, indent=2))
          PY
